name: ساخت APK اندروید

# فقط وقتی دستور ساخت داده شود اجرا می‌شود:
# یا از صفحه‌ی Actions با دکمه‌ی Run workflow، یا با فرستادن کد به شاخه‌ی build
on:
  workflow_dispatch:
  push:
    branches: [build]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: نصب وابستگی‌ها
        run: npm ci

      - name: ساخت پروژه‌ی اندروید
        env:
          N: ${{ github.run_number }}
        run: |
          echo "{\"code\": $N, \"name\": \"0.1.$N\"}" > www/version.json
          node scripts/prepare.mjs
          npx cap add android
          # ویجت، آیکن اعلان و شماره‌ی نسخه
          node scripts/patch-android.mjs $N
          npx cap sync android

      - name: ساخت فایل APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../raha-v0.1.${{ github.run_number }}.apk
          # اطمینان از اینکه فایل با کلید ثابت امضا شده (وگرنه روی نسخه‌ی قبلی نصب نمی‌شود)
          SIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          $SIGNER verify --print-certs ../raha-v0.1.${{ github.run_number }}.apk | tee /tmp/certs.txt
          grep -qi "SHA-256 digest: cf51722a20f5a94c40c3d3617f998f7c108c7cb1025a59c1e259411a26b377fd" /tmp/certs.txt || { echo "کلید امضا اشتباه است"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: raha-apk
          path: raha-v0.1.*.apk

      - name: انتشار در بخش Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: رها — نسخه‌ی آزمایشی ${{ github.run_number }}
          body: فایل APK را روی گوشی اندروید دانلود و نصب کنید.
          files: raha-v0.1.*.apk
